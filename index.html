      </div>
      <div class="year-box"><div class="lbl">Academic year</div><div class="val" id="yearVal"></div></div>
      <div class="sem-toggle" id="semToggle"></div>
      <div class="lbl nav-h">Workspace</div>
      <nav class="menu" id="menu">
